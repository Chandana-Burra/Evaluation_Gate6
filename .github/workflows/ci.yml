name: TripStack CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ui:
    name: Playwright UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Playwright_Final_Capstone
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Install UI dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Playwright UI tests (all)
        run: npx playwright test --project=chromium --retries=1
        env:
          BASE_URL: ${{ vars.TRIPSTACK_BASE_URL || 'https://tripstack.doomple.com/' }}
          HEADLESS: 'true'
          TRIPSTACK_EMAIL: ${{ secrets.TRIPSTACK_EMAIL }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
          SEAT_MAP_MAX_RENDER_MS: ${{ vars.SEAT_MAP_MAX_RENDER_MS || '5000' }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_Final_Capstone/artifacts/html-report
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: Playwright_Final_Capstone/artifacts/test-results
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-raw-ui
          path: Playwright_Final_Capstone/allure-results
          if-no-files-found: warn
      - name: Upload Allure generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ui
          path: Playwright_Final_Capstone/artifacts/allure-report
          if-no-files-found: warn

  api:
    name: RestAssured API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API_Testing_Finalcapstone
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
      - name: Run API tests (all)
        run: mvn -B -q test
      - name: Upload Maven surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: API_Testing_Finalcapstone/target/surefire-reports

  performance-gate:
    name: Performance Gate
    runs-on: ubuntu-latest
    needs: [ui]
    defaults:
      run:
        working-directory: Playwright_Final_Capstone
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Install UI dependencies
        run: npm ci
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run performance gate tests
        run: npx playwright test --project=chromium --grep @performance
        env:
          BASE_URL: ${{ vars.TRIPSTACK_BASE_URL || 'https://tripstack.doomple.com/' }}
          HEADLESS: 'true'
          TRIPSTACK_EMAIL: ${{ secrets.TRIPSTACK_EMAIL }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
          SEAT_MAP_MAX_RENDER_MS: ${{ vars.SEAT_MAP_MAX_RENDER_MS || '5000' }}
      - name: Generate Allure report (performance)
        if: always()
        run: |
          npm run allure:generate || echo "no allure results"
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-artifacts
          path: |
            Playwright_Final_Capstone/artifacts/html-report
            Playwright_Final_Capstone/artifacts/test-results
            Playwright_Final_Capstone/allure-results
            Playwright_Final_Capstone/artifacts/allure-report
          if-no-files-found: warn

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [api]
    defaults:
      run:
        working-directory: API_Testing_Finalcapstone
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
      - name: Run security negative tests
        run: mvn -B -q -Dtest=SecurityNegativeTests test
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-api-results
          path: API_Testing_Finalcapstone/target/surefire-reports
          if-no-files-found: warn

  ui-security:
    name: Playwright Security (UI)
    runs-on: ubuntu-latest
    needs: [ui]
    defaults:
      run:
        working-directory: Playwright_Final_Capstone
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Install UI dependencies
        run: npm ci
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Playwright security tests
        run: npx playwright test --project=chromium --grep @security
        env:
          BASE_URL: ${{ vars.TRIPSTACK_BASE_URL || 'https://tripstack.doomple.com/' }}
          HEADLESS: 'true'
          TRIPSTACK_EMAIL: ${{ secrets.TRIPSTACK_EMAIL }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
      - name: Generate Allure report (security)
        if: always()
        run: npm run allure:generate || echo "no allure results"
      - name: Upload security UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-ui-artifacts
          path: |
            Playwright_Final_Capstone/artifacts/html-report
            Playwright_Final_Capstone/artifacts/test-results
            Playwright_Final_Capstone/allure-results
            Playwright_Final_Capstone/artifacts/allure-report
          if-no-files-found: warn
